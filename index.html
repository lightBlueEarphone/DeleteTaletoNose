<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>消去しりとり</title>
    <meta
      name="description"
      content="五十音を駒として使うしりとりゲーム。CPU対戦とローカル対戦に対応しています。"
    />
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/hig.css" />
    <style>
      :root {
        --nav-bg: rgba(250, 250, 252, 0.86);
        --nav-border: rgba(0, 0, 0, 0.12);
        --nav-text: #1d1d1f;
        --nav-muted: #424245;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --nav-bg: rgba(22, 22, 23, 0.86);
          --nav-border: rgba(255, 255, 255, 0.16);
          --nav-text: #f5f5f7;
          --nav-muted: #d2d2d7;
        }
      }

      .app-nav {
        position: sticky;
        top: 0;
        z-index: 20;
        min-height: 48px;
        background: var(--nav-bg);
        border-bottom: 1px solid var(--nav-border);
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
      }

      .app-nav-inner {
        width: min(100% - 40px, 1024px);
        min-height: 48px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
      }

      .app-nav-title {
        flex: 0 0 auto;
        color: var(--nav-text);
        font-size: 0.95rem;
        font-weight: 650;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }

      .app-nav-links {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: clamp(18px, 3vw, 36px);
      }

      .app-nav a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        color: var(--nav-muted);
        text-decoration: none;
        font-size: 0.75rem;
        font-weight: 400;
        letter-spacing: 0;
        white-space: nowrap;
        transition: color 160ms ease;
      }

      .app-nav a:hover,
      .app-nav a[aria-current='page'] {
        color: var(--nav-text);
      }

      .app-nav a:focus-visible {
        outline: 2px solid #007aff;
        outline-offset: 3px;
      }

      @media (max-width: 520px) {
        .app-nav-inner {
          width: calc(100% - 28px);
          min-height: 48px;
          gap: 14px;
        }

        .app-nav-title {
          font-size: 0.85rem;
        }

        .app-nav-links {
          gap: 14px;
        }

        .app-nav a {
          font-size: 0.7rem;
        }
      }

      @media (max-width: 360px) {
        .app-nav-inner {
          width: calc(100% - 20px);
          gap: 8px;
        }

        .app-nav-links {
          gap: 9px;
        }

        .app-nav-title {
          font-size: 0.78rem;
        }

        .app-nav a {
          font-size: 0.66rem;
        }
      }
    </style>
  </head>
  <body>
    <nav class="app-nav" aria-label="アプリの切り替え">
      <div class="app-nav-inner">
        <span class="app-nav-title">Dr.Yの研究室</span>
        <div class="app-nav-links">
          <a href="https://lightBlueEarphone.github.io/DeleteTaletoNose/" aria-current="page">消去しりとり</a>
          <a href="https://lightBlueEarphone.github.io/Kobunbunpou/">古典文法</a>
        </div>
      </div>
    </nav>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
