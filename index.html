<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>消去しりとり</title>
    <meta
      name="description"
      content="五十音を駒として使うしりとりゲーム。CPU対戦とローカル対戦に対応しています。"
    />
    <link rel="stylesheet" href="./src/style.css" />
    <style>
      :root {
        --nav-bg: rgba(255, 255, 255, 0.72);
        --nav-border: rgba(0, 0, 0, 0.08);
        --nav-pill: rgba(10, 132, 255, 0.08);
        --nav-text: #1d1d1f;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --nav-bg: rgba(28, 28, 30, 0.72);
          --nav-border: rgba(255, 255, 255, 0.12);
          --nav-pill: rgba(99, 170, 255, 0.2);
          --nav-text: #f5f5f7;
        }
      }

      .app-nav {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--nav-border);
        background: var(--nav-bg);
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.02);
      }

      .app-nav a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 34px;
        padding: 7px 12px;
        border-radius: 999px;
        color: var(--nav-text);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        letter-spacing: -0.01em;
        transition: background-color 160ms ease, transform 160ms ease;
      }

      .app-nav a:hover {
        background: rgba(142, 142, 147, 0.12);
      }

      .app-nav a[aria-current='page'] {
        background: var(--nav-pill);
        color: #0a84ff;
        font-weight: 600;
      }

      .app-nav a:focus-visible {
        outline: 3px solid rgba(10, 132, 255, 0.35);
        outline-offset: 2px;
      }

      @media (max-width: 480px) {
        .app-nav {
          gap: 6px;
          padding: 8px 10px;
        }

        .app-nav a {
          min-height: 32px;
          padding: 7px 10px;
          font-size: 0.82rem;
        }
      }
    </style>
  </head>
  <body>
    <nav class="app-nav" aria-label="アプリの切り替え">
      <a href="https://lightBlueEarphone.github.io/DeleteTaletoNose/" aria-current="page">消去しりとり</a>
      <a href="https://lightBlueEarphone.github.io/Kobunbunpou/">古文文法</a>
    </nav>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
